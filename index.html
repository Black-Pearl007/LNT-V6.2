<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f5c400">
<link rel="stylesheet" href="">
<style>
:root{--bg:#f2f3f5;--card:#fff;--ink:#1a1d21;--mut:#5f6872;--bd:#d9dde2;--y:#f5c400;--yt:#1a1400;--ok:#16803c;--bad:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--card:#202328;--ink:#eceff2;--mut:#9aa3ad;--bd:#33383f;--ok:#4cc784;--bad:#ff7a7a}}
:root[data-theme="dark"]{--bg:#16181b;--card:#202328;--ink:#eceff2;--mut:#9aa3ad;--bd:#33383f;--ok:#4cc784;--bad:#ff7a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo,:root:not([data-theme="light"]) #gl{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}}
:root[data-theme="dark"] .logo,:root[data-theme="dark"] #gl{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.phd{display:flex;align-items:center;gap:12px;margin:8px 0 4px}.plogo{height:84px;width:auto;max-width:130px;object-fit:contain}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #rpt .plogo,:root:not([data-theme="light"]) #vsm .plogo{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}}
:root[data-theme="dark"] #rpt .plogo,:root[data-theme="dark"] #vsm .plogo{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
@media print{.plogo{filter:none!important}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Barlow",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{padding:16px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:"Barlow Condensed",sans-serif;font-size:2rem;margin:0;letter-spacing:.5px}
header span{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:3px solid var(--ink);padding-bottom:0;margin-bottom:14px}
nav button{background:none;border:0;padding:10px 14px;font:600 1rem "Barlow",sans-serif;color:var(--mut);white-space:nowrap;border-radius:8px 8px 0 0}
nav button[aria-current="page"]{background:var(--y);color:var(--yt)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--mut)}
.stat b{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.btn{background:var(--y);color:var(--yt);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--bd)}
.btn.red{background:var(--bad);color:#fff}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1;min-width:0}
.bar.tbar{flex-wrap:wrap}.bar.tbar>.vw,.bar.tbar>#q{flex:1 1 100%;width:100%}.bar.tbar select{flex:1 1 0;width:auto;min-width:0}.bar.tbar .btn{flex:1 1 0;min-width:0;white-space:normal;line-height:1.2}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.trip,.row{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.trip:hover{border-color:var(--ink)}
.top{display:flex;justify-content:space-between;gap:8px;font-size:1.1rem}
.amt{font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;font-weight:700}
.route{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg);border-radius:6px;padding:1px 8px;font-size:.85rem;color:var(--mut)}
.chip.good{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px}
.grid div{display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;margin:18px 0 8px}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);width:min(94vw,520px);padding:16px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}.f input,.f select{min-width:0;max-width:100%}
.f label{font-size:.82rem;font-weight:600;color:var(--mut);display:block;margin-bottom:2px}
.f .full{grid-column:1/-1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--bad);min-height:1.3em;margin:8px 0 0;font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
#inv{background:#fff;color:#111;border:1.5px solid var(--bd);border-radius:12px;padding:16px;margin-top:12px}
#inv th,#inv td{border-color:#ccc}
#inv table.it th,#inv table.it td{border:1px solid #999;padding:5px 6px}
#inv table.it th{background:#eceff3;font-weight:700}
#inv table.it th.l,#inv table.it td.l{text-align:left;white-space:normal}
#inv table.it td.r{text-align:right}
#inv table.it tfoot td{background:#fafafa}
tfoot{display:table-row-group}
#inv tr,#stm tr,#msm tr,#rpt tr{page-break-inside:avoid;break-inside:avoid}
#stm{background:#fff;color:#111;border:1.5px solid var(--bd);border-radius:12px;padding:16px;margin-top:12px}
#stm th,#stm td{border-color:#ccc}
#stm .note,#stm .empty{color:#555}
#inv,#rcp,#stm{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#msm{background:#fff;color:#111;border:1.5px solid var(--bd);border-radius:12px;padding:16px;margin-top:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#msm th,#msm td{border-color:#ccc}
#msm .note,#msm .empty{color:#555}
.sticky{position:sticky;top:0;z-index:15;background:var(--bg);padding:8px 0 2px}
.ih{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ih h3{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;margin:0}
.tot td{font-weight:700}
.note{color:var(--mut);font-size:.88rem}
@media print{body *{visibility:hidden}#inv,#inv *,#rpt,#rpt *,#rcp,#rcp *,#stm,#stm *,#vsm,#vsm *,#msm,#msm *{visibility:visible}#inv,#rpt,#rcp,#stm,#vsm,#msm{position:absolute;left:0;top:0;width:100%;border:0}#stm,#vsm,#msm{background:#fff;color:#111}#stm th,#stm td,#vsm th,#vsm td,#msm th,#msm td{border-color:#ccc}#rcp{background:#fff;color:#111}#inv table{font-size:11px}#rpt{background:#fff;color:#111}#rpt th,#rpt td{border-color:#ccc}}
.logo{height:64px;width:auto;object-fit:contain}
.hd{display:flex;align-items:center;gap:12px}
.warn{background:#fff3cd;color:#4a3a00;border:1.5px solid #e0b400;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.cn{font-family:"Libre Baskerville",serif;font-size:1.15rem;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:auto}
.dr{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:6px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.mrow{display:grid;grid-template-columns:54px 1fr auto;gap:6px;align-items:center;margin:3px 0;font-size:.9rem}
.mtrack{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.mfill{height:100%;border-radius:6px;background:var(--y)}
.mfill.ok{background:var(--ok)}.mfill.bad{background:var(--bad)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
[hidden]{display:none!important}
.role-staff .ownerOnly{display:none}
.role-staff [data-act^="del-"],.role-staff [data-act="inv-del"]{display:none!important}
body{padding-bottom:92px}
.btn{min-height:44px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:3px solid var(--ink);border-bottom:0;margin:0;gap:0;padding:0 0 env(safe-area-inset-bottom,0px);justify-content:space-around;overflow-x:auto;overflow-y:hidden}
nav button{flex:1 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;padding:6px 6px;border-radius:0;font-size:.82rem;line-height:1.2}
nav button small{font-size:.7rem;font-weight:500}
.vw{position:relative;display:block;flex:1;min-width:0}
.vw input{padding-right:52px}
.mic{position:absolute;right:5px;top:50%;transform:translateY(-50%);min-height:34px;padding:2px 9px;background:var(--bg);border:1.5px solid var(--bd);border-radius:8px}
.rt th:nth-child(2),.rt td:nth-child(2){text-align:right}
.rt th.l,.rt td.l{text-align:left}
#stm .rt th,#stm .rt td,#msm .rt th,#msm .rt td,#rpt .rt th,#rpt .rt td{border:1px solid #999}
#stm .rt th,#msm .rt th,#rpt .rt th{background:#eceff3}
.row .acts button{min-height:40px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#16803c;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.35);max-width:92vw;text-align:center}
#toast.bad{background:#c62828}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.gbox{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px;width:min(94vw,380px)}
.gbox label{display:block;margin:10px 0 2px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd"><img class="logo" id="lg" alt=""><div><h1>Trip Ledger</h1><span id="biz"></span><br><small id="sync"></small></div><button class="btn ghost" id="lo" data-act="logout" hidden style="margin-left:auto">Log out</button></header>
  <nav id="nav" aria-label="Sections"></nav>
  <div id="stwarn" class="warn" role="alert" hidden></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="gate" hidden><div class="gbox"><img id="gl" alt="" style="height:130px;width:auto;max-width:100%;object-fit:contain"><h1 style="font-size:1.8rem;margin:6px 0">Trip Ledger</h1>

  return driverNames().map(function(name){
    var d={name:name,trips:0,km:0,lit:0,kmL:0,days:0,wages:0,advance:0,salary:0},k=name.toLowerCase();
    db.trips.forEach(function(t){if((t.driver||"").trim().toLowerCase()!==k||t.date.slice(0,7)!==dm)return;d.trips++;d.km+=n(t.km);if(n(t.lit)>0){d.lit+=n(t.lit);d.kmL+=n(t.km);}});
    db.entries.forEach(function(e){if(!isDrvE(e)||e.name.trim().toLowerCase()!==k||e.date.slice(0,7)!==dm)return;if(e.kind==="wage"){if(n(e.amount)>0)d.days++;d.wages+=n(e.amount);}else d[e.kind]+=n(e.amount);});
    d.balance=d.wages-d.advance-d.salary;d.rate=(findBy(db.drivers,name)||{}).rate||0;return d;});
}

function tm(x){var d=new Date(x);return isNaN(d)?"":d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});}
function fh(x){return (Math.round(x*10)/10)+" h";}
function haltInfo(pick,drop){var a=new Date(pick),b=new Date(drop);if(!pick||!drop||isNaN(a)||isNaN(b)||b<=a)return null;var h=(b-a)/36e5,st=db.settings,over=Math.max(0,h-n(st.freeHrs));return{h:h,over:over,sug:Math.round(over*n(st.haltRate))};}
function updateHalt(){
  var box=$("#haltBox");if(!box)return;var i=haltInfo($("#tPick").value,$("#tDrop").value),st=db.settings;
  if(!i){box.textContent="Enter the pickup and drop time to see the trip duration and any halt.";return;}
  var t="Trip time: "+fh(i.h)+". Free time: "+fh(n(st.freeHrs))+". ";
  if(i.over<=0)box.textContent=t+"No halt time.";
  else if(n(st.haltRate)>0)box.innerHTML=esc(t)+'<b>Halt time: '+fh(i.over)+'. Suggested halt amount: '+money(i.sug)+'.</b> <button type="button" class="btn ghost" data-act="use-halt" data-v="'+i.sug+'" style="padding:2px 10px">Use this amount</button>';

function aging(name){
  var A=allocate(name),k=name.trim().toLowerCase();
  var ts=db.trips.filter(function(t){return t.client.trim().toLowerCase()===k;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id;});
  for(var i=0;i<ts.length;i++){if(bill(ts[i])-(A.paid[ts[i].id]||0)>0.5)return Math.floor((new Date(today())-new Date(ts[i].date))/864e5);}
  return 0;
}

/* Money received is matched to trips only as you decide: the advance entered on a trip, and payments you ticked for specific trips. Unticked money lowers the client's total balance but never marks any trip paid. */
function allocate(name){
  var k=name.trim().toLowerCase();
  var ts=db.trips.filter(function(t){return t.client.trim().toLowerCase()===k;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id;});
  var paid={},bl={},pool=0;
  ts.forEach(function(t){var b=bill(t),a=Math.min(b,n(t.adv));bl[t.id]=b;paid[t.id]=a;pool+=n(t.adv)-a;});
  db.entries.forEach(function(e){
    if(e.kind!=="client"||e.name.trim().toLowerCase()!==k)return;
    var used=0;
    (Array.isArray(e.alloc)?e.alloc:[]).forEach(function(x){var am=n(x.amt);used+=am;if(paid[x.id]===undefined){pool+=am;return;}var ap=Math.min(am,Math.max(0,bl[x.id]-paid[x.id]));paid[x.id]+=ap;pool+=am-ap;});
    pool+=Math.max(0,n(e.amount)-used);
  });
  return{paid:paid,bl:bl,extra:pool};
}
function tripPaid(t){var k=t.client.trim().toLowerCase(),A=AC[k]||(AC[k]=allocate(t.client)),p=A.paid[t.id]||0,b=bill(t);return{paid:p,due:Math.max(0,b-p),status:(b<=0.5||p>=b-0.5)?"paid":(p>0.5?"part":"unpaid")};}

function numWords(x){var P=Math.round(Math.abs(x)*100),rs=Math.floor(P/100),ps=P%100;
  var a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(v){return v<20?a[v]:b[Math.floor(v/10)]+(v%10?" "+a[v%10]:"");}
  function three(v){return(v>99?a[Math.floor(v/100)]+" Hundred"+(v%100?" ":""):"")+(v%100?two(v%100):"");}
  var o=[],cr=Math.floor(rs/1e7),lk=Math.floor(rs/1e5)%100,th=Math.floor(rs/1e3)%100,hu=rs%1000;
  if(cr)o.push(three(cr)+" Crore");if(lk)o.push(two(lk)+" Lakh");if(th)o.push(two(th)+" Thousand");if(hu)o.push(three(hu));
  var w=o.join(" ");
  if(ps)return(w||"Zero")+" and "+two(ps)+" Paise";
  return w||"Zero";}

/* Undo a payment that was marked by mistake: take the part of each payment that was counted for this trip off that payment. */
function unpayInfo(t){
  var T=payTrace(t.client),by={};
  (T.use[t.id]||[]).forEach(function(u){if(u.src!=="adv")by[u.src]=(by[u.src]||0)+u.amt;});
  var list=Object.keys(by).map(function(k){var e=db.entries.filter(function(x){return String(x.id)===k;})[0];return e?{e:e,cut:Math.round(by[k]*100)/100}:null;}).filter(Boolean);
  return{list:list,own:Math.min(bill(t),n(t.adv))};
}
function openUnpay(id){
  var t=db.trips.filter(function(x){return x.id==id;})[0];if(!t)return;
  var I=unpayInfo(t),tot=sum(I.list,function(x){return x.cut;});
  var h='<h2 style="margin-top:0">Mark as unpaid</h2><p><b>'+esc(t.client)+'</b>, '+dt(t.date)+', '+esc(t.from)+' to '+esc(t.to)+', bill '+money(bill(t))+'.</p>';
  if(!I.list.length)h+='<p>No client payment is counted for this trip.'+(I.own>0.5?' It shows paid only because of the <b>Advance '+money(I.own)+'</b> entered on the trip. To change that, edit the trip and correct the Advance amount.':'')+'</p><div class="acts"><button class="btn" data-act="close">OK</button></div>';
  else h+='<p>These payments are counted for this trip:</p>'+I.list.map(function(x){return'<div class="row"><div class="top"><b>'+dt(x.e.date)+'</b><span class="amt">'+money(x.cut)+'</span></div><div class="route">'+(x.e.mode?esc(x.e.mode)+', ':"")+'payment of '+money(x.e.amount)+(x.e.no?', receipt '+esc(x.e.no):"")+'</div></div>';}).join("")+
    '<p>The red button takes '+money(tot)+' off these payments (a payment with nothing left is deleted). The client\'s pending amount goes up by '+money(tot)+'. Use it only when a payment was marked by mistake.'+(I.own>0.5?' The Advance '+money(I.own)+' entered on the trip stays.':'')+'</p><p class="err" id="err"></p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn red" data-act="unpay-do" data-id="'+id+'">Mark as unpaid</button></div>';
  $("#dlg").innerHTML=h;
}
function unpayDo(id){
  var t=db.trips.filter(function(x){return x.id==id;})[0];if(!t)return;
  var I=unpayInfo(t);if(!I.list.length){$("#dlg").close();return;}
  var rem={},chg={};
  I.list.forEach(function(x){var rest=Math.round((n(x.e.amount)-x.cut)*100)/100;if(rest<=0.5)rem[x.e.id]=1;else chg[x.e.id]={amount:rest,was:x.e.was||n(x.e.amount),alloc:(Array.isArray(x.e.alloc)?x.e.alloc:[]).filter(function(a){return a.id!=t.id;})};});
  takePoint("before mark as unpaid");
  db.entries=db.entries.filter(function(e){return !rem[e.id];});
  db.entries.forEach(function(e){if(chg[e.id]){e.was=chg[e.id].was;e.amount=chg[e.id].amount;e.alloc=chg[e.id].alloc;}});
  save();$("#dlg").close();render();toast("Trip marked as unpaid","பணம் செலுத்தவில்லை என குறிக்கப்பட்டது",true);
}

  var v=function(k){return n($("#"+k).value);},b=$("#billBox");if(!b)return;
  b.innerHTML='Bill total for the client: <b>'+money(v("tAmt")+v("tHalt")+v("tToll")+v("tAir")+v("tLab")+v("tBor")+v("tOth"))+'</b>';

function saveTrip(id){
  var g=function(k){return $("#"+k).value.trim();},old=(id&&db.trips.filter(function(x){return x.id==id;})[0])||{};
  var t={id:id?+id:Date.now(),date:g("tDate"),client:g("tClient"),from:g("tFrom"),to:g("tTo"),driver:g("tDriver"),vehicle:g("tVehicle"),
    amount:n(g("tAmt")),halt:n(g("tHalt")),toll:n(g("tToll")),air:n(g("tAir")),labour:n(g("tLab")),border:n(g("tBor")),other:n(g("tOth")),fine:n(g("tFine")),adv:n(g("tAdv")),km:n(g("tKm")),
    lit:old.lit||0,dAmt:old.dAmt||0,note:g("tNote"),pick:g("tPick"),drop:g("tDrop"),ref:g("tRef"),recNo:g("tRec"),boe:g("tBoe"),hire:$("#tHire")?n(g("tHire")):n(old.hire)};
  if(!t.date||!t.client){$("#err").textContent="Please enter the date and the client name.";return;}
  var hi=haltInfo(t.pick,t.drop);if(hi&&hi.over>0&&!t.halt&&!window._ha){window._ha=1;$("#err").textContent="Halt time is "+fh(hi.over)+". Please enter the halt amount, or tap Save trip again to save without it.";return;}window._ha=0;
  var cph=g("tCPh"),cem=g("tCEm"),ex=findBy(db.clients,t.client);
  if(!ex&&!cph&&!window._cp){window._cp=1;$("#err").textContent="Please enter the customer's phone number so invoices can be sent on WhatsApp, or tap Save trip again to save without it.";return;}
  if(!ex)db.clients.push({id:Date.now()+1,code:nextCode(db.clients,"C"),name:t.client,phone:cph,email:cem});
  else if((cph&&cph!==ex.phone)||(cem&&cem!==ex.email)){if(cph)ex.phone=cph;if(cem)ex.email=cem;}
  if(id)db.trips=db.trips.map(function(x){return x.id==id?t:x;});else db.trips.push(t);
  save();$("#dlg").close();render();toast("Trip saved","பயணம் சேமிக்கப்பட்டது");
}

function fillTrips(){
  var w=$("#eTripsW");if(!w)return;
  var nm=$("#eName").value.trim(),k=nm.toLowerCase(),isC=$("#eKind").value==="client";
  var A=(nm&&isC)?allocate(nm):null;

  w.hidden=!list.length;
  $("#eTrips").innerHTML=list.map(function(t){var due=A.bl[t.id]-A.paid[t.id];return'<label class="chk" style="margin:4px 0"><input type="checkbox" class="etk" data-id="'+t.id+'" data-due="'+due+'"> '+dt(t.date)+', '+esc(t.from)+' to '+esc(t.to)+' (due '+money(due)+')</label>';}).join("");

function updPayAmt(){var sm=0,any=false;document.querySelectorAll("#eTrips .etk:checked").forEach(function(c){sm+=n(c.dataset.due);any=true;});if(any)$("#eAmt").value=Math.round(sm*100)/100;}
function saveEntry(){
  var e={id:Date.now(),kind:$("#eKind").value,date:$("#eDate").value,name:$("#eName").value.trim(),amount:n($("#eAmt").value),note:$("#eNote").value.trim()};
  if(e.kind==="client")e.mode=$("#eMode").value;

  if(e.kind==="client"){var rem=e.amount,al=[];document.querySelectorAll("#eTrips .etk:checked").forEach(function(c){var take=Math.min(rem,n(c.dataset.due));if(take>0.0001){al.push({id:+c.dataset.id,amt:Math.round(take*100)/100});rem-=take;}});if(al.length)e.alloc=al;}
  db.entries.push(e);save();$("#dlg").close();render();
  if(e.kind==="client")toast("Payment saved","பணம் பதிவானது");else toast("Saved","சேமிக்கப்பட்டது");
}

    var a=db.entries.filter(function(e){return e.kind==="advance"&&e.daily&&e.date===date&&e.name===nm;})[0];
    var present=w?n(w.amount)>0:true,wage=w&&n(w.amount)>0?w.amount:((findBy(db.drivers,nm)||{}).rate||"");
    return'<div class="dr"><label class="chk"><input type="checkbox" id="yp'+i+'"'+(present?" checked":"")+'> '+esc(nm)+'</label>'+
      fld("yw"+i,"Wage ₹",wage,"number","",'inputmode="decimal" min="0"')+fld("ya"+i,"Advance ₹",a?a.amount:"","number","",'inputmode="decimal" min="0"')+'</div>';

function saveDaily(){
  var date=$("#yDate").value;if(!date){$("#err").textContent="Pick a date.";return;}
  driverNames().forEach(function(nm,i){
    var pres=$("#yp"+i).checked,w=n($("#yw"+i).value),a=n($("#ya"+i).value);
    var ew=db.entries.filter(function(e){return e.kind==="wage"&&e.date===date&&e.name===nm;})[0];
    var ea=db.entries.filter(function(e){return e.kind==="advance"&&e.daily&&e.date===date&&e.name===nm;})[0];
    if(ew){ew.amount=pres?w:0;ew.note=pres?"":"absent";}else db.entries.push({id:dayId("w",date,nm),kind:"wage",date:date,name:nm,amount:pres?w:0,note:pres?"":"absent",daily:true});
    if(ea)ea.amount=a;else if(a>0)db.entries.push({id:dayId("a",date,nm),kind:"advance",date:date,name:nm,amount:a,note:"",daily:true});
  });
  save();$("#dlg").close();render();toast("Day saved","நாள் சேமிக்கப்பட்டது");
}


/* ---------- Other (hired) vehicles: owners, hire to pay, payments made ---------- */
function ohMaster(){return db.entries.filter(function(e){return e.kind==="hveh";});}
function ohNames(){
  return uniq(ohMaster().map(function(e){return vkey(e.name);})
    .concat(db.entries.filter(function(e){return e.kind==="hpay";}).map(function(e){return vkey(e.name);}))
    .concat(db.trips.filter(function(t){return n(t.hire)>0;}).map(function(t){return vkey(t.vehicle);}))
    .concat(ownFleetSet()?db.trips.map(function(t){return vkey(t.vehicle);}).filter(function(v){return v&&!ownFleetSet()[v];}):[]));   /* any vehicle that is not one of ours is hired */
}
function ownFleetSet(){var m=vdocMaster();if(!m.length)return null;var o={};m.forEach(function(e){o[vkey(e.name)]=1;});return o;}
function ohStats(){
  var byDate=function(a,b){return b.date<a.date?-1:b.date>a.date?1:0;};
  return ohNames().map(function(v){
    var m=ohMaster().filter(function(e){return vkey(e.name)===v;})[0]||{};
    var tr=db.trips.filter(function(t){return vkey(t.vehicle)===v;}).sort(byDate);
    var pays=db.entries.filter(function(e){return e.kind==="hpay"&&vkey(e.name)===v;}).sort(byDate);
    var hire=sum(tr,function(t){return n(t.hire);}),paid=sum(pays,function(e){return n(e.amount);});
    return{no:v,m:m,tr:tr,pays:pays,hire:hire,paid:paid,bal:hire-paid};
  }).sort(function(a,b){return b.bal-a.bal;});
}
function viewHired(){
  var S=ohStats(),tot=sum(S,function(x){return x.bal;});
  var h='<h2 style="margin-top:0">Other vehicles (hired)</h2><div class="acts" style="justify-content:flex-start;margin-bottom:6px"><button class="btn" data-act="new-hveh">Add vehicle</button><button class="btn ghost" data-act="new-hpay">Pay owner</button></div>'+
    '<p class="note">For vehicles you hire from other owners. Enter the hire amount on a trip (“Outside vehicle hire”) with that vehicle number and it is added here automatically. Our own vehicles are not listed.</p>';
  if(!S.length)return h+'<div class="empty">No other vehicles yet. Tap “Add vehicle” to save an owner’s details.</div>';
  h+='<div class="stats"><div class="stat"><small>Hire still to pay</small><b class="'+(tot>0.5?"bad":"ok")+'">'+money(tot)+'</b></div><div class="stat"><small>Vehicles</small><b>'+S.length+'</b></div></div>';
  h+=S.map(function(x){
    var m=x.m,st=x.bal>0.5?money(x.bal)+" to pay":x.bal<-0.5?money(-x.bal)+" paid extra":"Settled";
    return'<div class="row"><div class="top"><b>'+esc(x.no)+'</b><span class="amt '+(x.bal>0.5?"bad":"ok")+'">'+st+'</span></div>'+
      '<div class="route">'+esc([m.owner,m.phone].filter(Boolean).join("   ")||"No owner details yet")+'</div>'+
      (m.bank?'<div class="chips"><span class="chip">'+esc(m.bank)+'</span></div>':"")+(m.note?'<div class="chips"><span class="chip">'+esc(m.note)+'</span></div>':"")+
      '<div class="grid"><div><span>Trips</span><b>'+x.tr.length+'</b></div><div><span>Hire total</span><b>'+money(x.hire)+'</b></div><div><span>Paid to owner</span><b>'+money(x.paid)+'</b></div></div>'+
      (x.tr.length?'<div style="margin-top:6px">'+x.tr.slice(0,5).map(function(t){return'<div class="note" data-act="edit-trip" data-id="'+t.id+'" style="cursor:pointer">'+dt(t.date)+', '+esc(t.client)+', '+esc(t.from)+' to '+esc(t.to)+(n(t.hire)?' — hire '+money(t.hire):' — hire not entered')+'</div>';}).join("")+(x.tr.length>5?'<div class="note">…and '+(x.tr.length-5)+' earlier trips</div>':"")+'</div>':"")+
      '<div class="acts" style="margin-top:8px;justify-content:flex-start"><button class="btn" data-act="new-hpay" data-name="'+esc(x.no)+'">Pay owner</button><button class="btn ghost" data-act="edit-hveh" data-name="'+esc(x.no)+'">Edit details</button>'+(m.phone?'<a class="btn ghost" href="tel:'+esc(String(m.phone).replace(/[^0-9+]/g,""))+'">Call</a>':"")+'</div></div>';
  }).join("");
  var P=db.entries.filter(function(e){return e.kind==="hpay";}).sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0;});
  if(P.length)h+='<h2>Payments to vehicle owners</h2>'+P.map(function(e){
    return'<div class="row"><div class="top"><b>'+esc(vkey(e.name))+'</b><span class="amt">'+money(e.amount)+'</span></div><div class="chips"><span class="chip">'+dt(e.date)+'</span>'+(e.mode?'<span class="chip">'+esc(e.mode)+'</span>':"")+(e.note?'<span class="chip">'+esc(e.note)+'</span>':"")+'</div>'+

  return h;

/* ---------- Vehicles: document expiry reminders (owner only) ---------- */
/* Stored as entries of kind "vdoc" (one per vehicle). The shared server already keeps every kind except wage, advance and salary away from staff. */
var VDOCS=[["ins","Insurance"],["fc","Fitness (FC)"],["permit","Permit"],["tax","Road tax"],["puc","Pollution (PUC)"]];
function vdocMaster(){return db.entries.filter(function(e){return e.kind==="vdoc";});}
function ownVehicles(){
  if(vdocMaster().length)return uniq(vdocMaster().map(function(e){return vkey(e.name);}).filter(Boolean));   /* once you add your own vehicles, only those are "ours" */
  var h={};ohNames().forEach(function(x){h[x]=1;});
  return uniq(vdocMaster().map(function(e){return vkey(e.name);}).concat(vehicleNames().filter(function(v){return v&&!h[v];})));
}
function daysTo(d){return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);}
function addMonths(d,k){var p=d.split("-"),y=+p[0],m=+p[1]-1+k,day=+p[2];y+=Math.floor(m/12);m=((m%12)+12)%12;var last=new Date(y,m+1,0).getDate();return y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+Math.min(day,last)).slice(-2);}
function docList(m){
  var o=[];
  VDOCS.forEach(function(x){if(m[x[0]])o.push({label:x[1],date:m[x[0]],days:daysTo(m[x[0]])});});
  if(m.othDate)o.push({label:m.othName||"Other document",date:m.othDate,days:daysTo(m.othDate)});
  return o;
}
function docState(days){return days<0?"bad":days<=(n(db.settings.remDays)||30)?"soon":"ok";}
function dueText(d){return d.days<0?"expired "+(-d.days)+(d.days===-1?" day":" days")+" ago":d.days===0?"expires today":d.days+(d.days===1?" day":" days")+" left";}
function docAlerts(){
  var out=[];
  vdocMaster().forEach(function(m){docList(m).forEach(function(d){var s=docState(d.days);if(s!=="ok")out.push({veh:vkey(m.name),label:d.label,date:d.date,days:d.days,s:s});});});
  return out.sort(function(a,b){return a.days-b.days;});
}
function docAlertCount(){return docAlerts().length;}
function docWarn(){
  var a=docAlerts();if(!a.length)return"";
  var x=a[0],ex=a.filter(function(y){return y.s==="bad";}).length;
  return'<div class="warn">'+(ex?ex+' vehicle document'+(ex>1?'s have':' has')+' expired. ':a.length+' vehicle document'+(a.length>1?'s are':' is')+' due soon. ')+'Most urgent: '+esc(x.veh)+', '+esc(x.label)+' '+esc(dueText(x))+'. <button class="btn ghost" data-tab="vehicles" style="margin-left:6px;padding:4px 10px">See list</button></div>';
}
function docChip(d){
  var s=docState(d.days),st=s==="soon"?' style="background:#fff3cd;color:#4a3a00;font-weight:600"':s==="bad"?' style="font-weight:700"':"";
  return'<span class="chip '+(s==="ok"?"good":s==="bad"?"bad":"")+'"'+st+'>'+esc(d.label)+': '+dt(d.date)+' ('+dueText(d)+')</span>';
}
function viewVehicles(){
  var list=ownVehicles(),al=docAlerts(),exd=al.filter(function(x){return x.s==="bad";}).length,cut=addMonths(today(),-12),rd=n(db.settings.remDays)||30;
  var h='<div class="acts" style="justify-content:flex-start;margin:0 0 6px"><button class="btn" data-act="new-vdoc">Add vehicle</button><button class="btn ghost" data-act="new-exp">Add expense</button></div>'+
    '<p class="note">Enter the expiry date of each document. Warnings appear here and on the Trips page starting '+rd+' days before expiry (change this in More). The app cannot send messages by itself, so it only warns while it is open.'+(online()?' For a daily email that arrives even when the app is closed, run the one-time reminder setup in ONLINE-SETUP.md.':'')+'</p>';
  if(!list.length)return h+'<div class="empty">No vehicles yet. Tap “Add vehicle”, or add trips with a vehicle number.</div>';
  var info=list.map(function(v){
    var m=vdocMaster().filter(function(e){return vkey(e.name)===v;})[0]||{},docs=docList(m);
    return{v:v,m:m,docs:docs,mn:docs.length?Math.min.apply(null,docs.map(function(d){return d.days;})):99999,
      exp:sum(db.entries.filter(function(e){return e.kind==="exp"&&vkey(e.veh)===v&&e.date>=cut;}),function(e){return n(e.amount);})};
  }).sort(function(a,b){return a.mn-b.mn||(a.v<b.v?-1:1);});
  h+='<div class="stats"><div class="stat"><small>Vehicles</small><b>'+list.length+'</b></div><div class="stat"><small>Documents expired</small><b class="'+(exd?"bad":"ok")+'">'+exd+'</b></div><div class="stat"><small>Due within '+rd+' days</small><b class="'+(al.length-exd?"bad":"ok")+'">'+(al.length-exd)+'</b></div></div>';
  return h+info.map(function(x){
    var s=x.mn===99999?"":docState(x.mn),st=x.mn===99999?"Add dates":s==="bad"?"Expired":s==="soon"?"Due soon":"All valid";
    return'<div class="row"><div class="top"><b>'+esc(x.v)+'</b><span class="amt '+(s==="ok"?"ok":s?"bad":"")+'">'+st+'</span></div>'+
      (x.m.model?'<div class="route">'+esc(x.m.model)+'</div>':"")+
      (x.docs.length?'<div class="chips">'+x.docs.sort(function(a,b){return a.days-b.days;}).map(docChip).join("")+'</div>':'<div class="route">No expiry dates entered yet.</div>')+
      '<div class="grid"><div><span>Expenses, last 12 months</span><b>'+money(x.exp)+'</b></div></div>'+
      (x.m.note?'<div class="chips"><span class="chip">'+esc(x.m.note)+'</span></div>':"")+
      '<div class="acts" style="margin-top:8px"><button class="btn" data-act="edit-vdoc" data-name="'+esc(x.v)+'">Edit details</button><button class="btn ghost" data-act="new-exp" data-name="'+esc(x.v)+'">Add expense</button></div></div>';
  }).join("");
}
function openVdoc(name){
  var m=name?(vdocMaster().filter(function(e){return vkey(e.name)===vkey(name);})[0]||{name:name}):{};
  $("#dlg").innerHTML='<h2 style="margin-top:0">'+(name?"Vehicle details":"Add vehicle")+'</h2><div class="f">'+
   fld("vdNo","Vehicle number",m.name||"","text","full",(name?"disabled ":"")+'autocapitalize="characters"')+fld("vdModel","Model or type (optional)",m.model||"","text","full")+
   fld("vdIns","Insurance expires",m.ins||"","date")+fld("vdFc","Fitness (FC) expires",m.fc||"","date")+fld("vdPermit","Permit expires",m.permit||"","date")+fld("vdTax","Road tax paid up to",m.tax||"","date")+fld("vdPuc","Pollution (PUC) expires",m.puc||"","date")+
   fld("vdOthN","Other document name",m.othName||"")+fld("vdOthD","Other document expires",m.othDate||"","date")+fld("vdNote","Remarks",m.note||"","text","full")+'</div>'+
   '<p class="note">Leave a date empty if that document does not apply. When you renew a document, enter the new date here. Record what you paid in the Expenses tab.</p><p class="err" id="err"></p><div class="acts">'+
   (name&&m.id?'<button class="btn red" data-act="del-vdoc" data-name="'+esc(name)+'" style="margin-right:auto">Remove details</button>':"")+'<button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save-vdoc">Save</button></div>';

function saveVdoc(){
  var no=vkey($("#vdNo").value);if(!no){$("#err").textContent="Enter the vehicle number.";return;}

/* Real profit = billed - diesel - trip costs (toll, fines, outside hire...) - driver wages - other expenses. For one vehicle, driver wages are not split, so they are left out. */
function plCalc(a,b,vk){
  var inP=function(d){return d>=a&&d<=b;},k=vkey(vk);
  var tr=db.trips.filter(function(t){return inP(t.date)&&(!k||vkey(t.vehicle)===k);});
  var f=function(x){return sum(tr,function(t){return n(t[x]);});};
  var inc=sum(tr,bill);
  var fuel=sum(db.fuel.filter(function(x){return inP(x.date)&&(!k||vkey(x.vehicle)===k);}),function(x){return n(x.amount);})+f("dAmt");
  var tripCost=f("toll")+f("air")+f("labour")+f("border")+f("other")+f("fine")+f("hire");
  var wages=k?0:sum(db.entries.filter(function(e){return e.kind==="wage"&&inP(e.date);}),function(e){return n(e.amount);});
  var ex=expList([a,b],k),exp=sum(ex,function(e){return n(e.amount);}),before=inc-fuel-tripCost-wages;
  return{n:tr.length,inc:inc,fuel:fuel,tripCost:tripCost,wages:wages,exp:exp,before:before,real:before-exp};
}

function daysSince(d){return Math.round((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/864e5);}
function premGet(name){var k=String(name||"").trim().toLowerCase();return db.entries.filter(function(e){return e.kind==="prem"&&String(e.name).trim().toLowerCase()===k;})[0];}

function remRows(){

    var p=premGet(c.name)||{},since=p.last?daysSince(p.last):null,snoozed=!!(p.snooze&&p.snooze>td),ut=unpaidTrips(c.name);
    var old=ut.length?c.age>=gr:true;
    return{c:c,p:p,since:since,snoozed:snoozed,ut:ut,cd:findBy(db.clients,c.name)||{},due:old&&!snoozed&&(since===null||since>=gap)};
  }).sort(function(a,b){return (b.due-a.due)||(b.c.age-a.c.age)||(b.c.pending-a.c.pending);});

function archFromFile(f){
  var bx=$("#archfilebox");if(!f||!bx)return;
  var rd=new FileReader();
  rd.onload=function(){
    var o;try{o=JSON.parse(String(rd.result));}catch(x){bx.innerHTML='<p class="note">This is not an archive file. Nothing was changed.</p>';return;}
    var items=archFileItems(o||{});
    if(!items.length||!(o.trips||o.payments||o.diesel||o.driverEntries)){bx.innerHTML='<p class="note">This is not an archive file. Nothing was changed.</p>';return;}
    var res=archCore(items);
    if(!res.ok){bx.innerHTML='<p class="note">'+esc(res.msg)+'</p>';return;}
    render();var b2=$("#archfilebox");if(b2)b2.innerHTML='<p class="note">'+archSummary(res.cnt)+'</p>';
  };
  rd.onerror=function(){bx.innerHTML='<p class="note">Could not read the file.</p>';};
  rd.readAsText(f);
}
